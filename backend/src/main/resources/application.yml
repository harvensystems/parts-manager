spring:
  application:
    name: part-manager-backend


  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/part_manager}

  ai:
    google:
      genai:
        api-key: ${AI_API_KEY:mock-key}
        chat:
          options:
            model: gemini-3.6-flash
  webflux:
    format:
      date: iso

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
